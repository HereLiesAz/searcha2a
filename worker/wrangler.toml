name = "searcha2a-api"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://searcha2a.azphalt.store"

# One SQLite-backed Durable Object per request UUID, created automatically on deploy.
[[durable_objects.bindings]]
name = "RESULTS"
class_name = "SearchResult"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "AgentRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchResult"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentRegistry"]

