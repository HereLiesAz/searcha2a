name = "searcha2a-api"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://searcha2a.azphalt.store"
# MCP endpoint (POST /mcp). Off until you set this to "true" after reviewing docs/MCP.md.
MCP_ENABLED = "false"

# One SQLite-backed Durable Object per request UUID, created automatically on deploy.
[[durable_objects.bindings]]
name = "RESULTS"
class_name = "SearchResult"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "AgentRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchResult"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentRegistry"]

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60

# tools/call on POST /mcp only. Approximate, per location: abuse damping, not accounting.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 30
period = 60

# Optional model inference. A missing entitlement returns explicitly labelled keyword fallback.
[ai]
binding = "AI"
