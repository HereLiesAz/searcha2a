name = "searcha2a-api"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://searcha2a.azphalt.store"

# One SQLite-backed Durable Object per request UUID, created automatically on deploy.
[[durable_objects.bindings]]
name = "RESULTS"
class_name = "SearchResult"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchResult"]

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60
