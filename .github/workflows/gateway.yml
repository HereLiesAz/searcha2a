name: Deploy API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare credentials absent; gateway deployment skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Provision results mailbox
        if: steps.configured.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          authorization="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          namespace_id=""
          page=1
          while :; do
            payload="$(curl --fail-with-body --silent --show-error -H "$authorization" --get \
              --data-urlencode "page=$page" --data-urlencode 'per_page=100' "$api")"
            jq -e '.success == true and (.result | type == "array")' <<<"$payload" >/dev/null
            namespace_id="$(jq -r '[.result[] | select(.title == "searcha2a-results") | .id][0] // empty' <<<"$payload")"
            [[ -z "$namespace_id" ]] || break
            total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$payload")"
            (( page < total_pages )) || break
            page=$((page + 1))
          done
          if [[ -z "$namespace_id" ]]; then
            payload="$(curl --fail-with-body --silent --show-error -X POST -H "$authorization" \
              -H 'Content-Type: application/json' --data '{"title":"searcha2a-results"}' "$api")"
            jq -e '.success == true and (.result.id | type == "string")' <<<"$payload" >/dev/null
            namespace_id="$(jq -r '.result.id' <<<"$payload")"
          fi
          [[ "$namespace_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo '::error::Invalid Cloudflare KV ID'; exit 1; }
          python3 - "$namespace_id" <<'PYCODE'
          import re
          import sys
          from pathlib import Path
          file = Path('worker/wrangler.toml')
          updated, count = re.subn(r'(?m)^id = "[^"]+"        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx --yes wrangler@4 deploy
, 'id = "' + sys.argv[1] + '"', file.read_text())
          if count != 1:
              raise SystemExit('Expected exactly one RESULTS KV id in worker/wrangler.toml')
          file.write_text(updated)
          PYCODE
          echo 'Resolved existing or newly created SearchA2A KV namespace.'
      - name: Deploy Cloudflare Worker
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx --yes wrangler@4 deploy
