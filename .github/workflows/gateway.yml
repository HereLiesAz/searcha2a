name: Deploy API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare credentials absent; gateway deployment skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Cloudflare Worker
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx --yes wrangler@4 deploy
      - name: Verify Durable Object mailbox binding
        if: steps.configured.outputs.ready == 'true'
        env:
          SEARCHA2A_API_URL: ${{ vars.SEARCHA2A_API_URL }}
        run: |
          set -euo pipefail
          test -n "$SEARCHA2A_API_URL"
          uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          code="$(curl --silent --show-error --retry 4 --retry-delay 2 \
            -o /tmp/searcha2a-mailbox.json -w '%{http_code}' \
            "${SEARCHA2A_API_URL%/}/api/v1/results/$uuid")"
          [[ "$code" = 404 ]] || { echo "::error::Mailbox route returned HTTP $code"; cat /tmp/searcha2a-mailbox.json; exit 1; }
          jq -e '.error == "Search expired or unknown"' /tmp/searcha2a-mailbox.json >/dev/null
          echo 'Durable Object mailbox routing verified.'

      - name: Verify public indexed Agent Directory
        if: steps.configured.outputs.ready == 'true'
        env:
          SEARCHA2A_API_URL: ${{ vars.SEARCHA2A_API_URL }}
        run: |
          set -euo pipefail
          test -n "$SEARCHA2A_API_URL"
          code="$(curl --silent --show-error --retry 3 --retry-delay 2 --get --data-urlencode 'q=weather' -o /tmp/searcha2a-directory.json -w '%{http_code}' "${SEARCHA2A_API_URL%/}/api/v1/directory")"
          [[ "$code" = 200 ]] || {
            echo "::error::Indexed directory API returned HTTP $code"
            cat /tmp/searcha2a-directory.json
            exit 1
          }
          jq -e '
            .schema == 1 and .source == "searcha2a" and
            (.match_mode == "semantic" or .match_mode == "keyword-fallback") and
            .verification == "card_read_only" and
            (.results | type == "array") and (.count | type == "number")
          ' /tmp/searcha2a-directory.json >/dev/null
          jq -r '"Indexed directory verified: mode=\(.match_mode), results=\(.count)"' /tmp/searcha2a-directory.json
