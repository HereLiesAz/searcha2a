name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.mjs
      - run: node --check site/app.js
      - run: node --check worker/index.mjs
      - run: node --check worker/mcp.mjs
      - run: node --check worker/verification.mjs
