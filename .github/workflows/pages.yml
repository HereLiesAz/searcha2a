name: Reindex and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: searcha2a-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCHA2A_AUTHORIZED_CATALOGS_JSON: ${{ secrets.SEARCHA2A_AUTHORIZED_CATALOGS_JSON }}
        run: |
          mkdir -p dist
          cp -R site/. dist/
          python3 src/discover.py --output dist/api/v1/catalog.json
      - name: Ingest scheduled crawl into persistent registry
        env:
          REGISTRY_API_URL: ${{ vars.SEARCHA2A_API_URL }}
          REGISTRY_SYNC_SECRET: ${{ secrets.RESULT_CALLBACK_SECRET }}
        run: python3 src/registry_sync.py --catalog dist/api/v1/catalog.json
      - name: Export Azphalt external-agent listings
        run: python3 src/azphalt_listings.py --catalog dist/api/v1/catalog.json --output dist/api/v1/azphalt-listings.json
      - name: Mirror published Azphalt feed to GitHub raw CDN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          path = 'site/api/v1/azphalt-listings.json'
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/contents/{path}?ref=agent-feed'
          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          content = Path('dist/api/v1/azphalt-listings.json').read_bytes()
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  previous = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              previous = {}
          sha = previous.get('sha')
          if sha and base64.b64decode(previous.get('content', '').replace('\n', '')) == content:
              print('Azphalt Git mirror already current')
          else:
              payload = {
                  'message': 'chore: refresh published A2A listings [skip ci]',
                  'branch': 'agent-feed',
                  'content': base64.b64encode(content).decode('ascii'),
              }
              if sha:
                  payload['sha'] = sha
              request = urllib.request.Request(url.split('?')[0],
                  data=json.dumps(payload).encode('utf-8'), headers=headers, method='PUT')
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 201):
                      raise SystemExit(f'Failed to mirror feed: HTTP {response.status}')
              print('Mirrored Azphalt listings into agent-feed branch')
          PY
      - name: Build stable agent resolution files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('dist/api/v1/catalog.json').read_text())
          target = Path('dist/api/v1/agents')
          target.mkdir(parents=True, exist_ok=True)
          for agent in catalog['results']:
              (target / (agent['id'] + '.json')).write_text(json.dumps(agent, ensure_ascii=False))
          PY
      - name: Configure public client
        env:
          API_URL: ${{ vars.SEARCHA2A_API_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/config.json', 'w', encoding='utf-8') as f:
              json.dump({'apiBaseUrl': os.getenv('API_URL', '')}, f)
          PY
      - name: Check Pages is enabled
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$response" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages not enabled (HTTP $response); deploy skipped."
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-enabled.outputs.enabled == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
