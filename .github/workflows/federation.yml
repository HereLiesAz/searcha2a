name: Check optional A2A adapter

on:
  push:
    branches: [main]
    paths:
      - 'federation/**'
      - 'tests/federation.test.mjs'
      - '.github/workflows/federation.yml'
  pull_request:
    paths:
      - 'federation/**'
      - 'tests/federation.test.mjs'
      - '.github/workflows/federation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check federation/index.mjs
      - run: node --test tests/federation.test.mjs
